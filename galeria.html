<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>herbarium — galería</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body { padding: 1rem; }
      h1, p { font: 12px/1.4 var(--mono, monospace); color: var(--muted, #8b93a3); }
      h1 { color: var(--ink, #e8eaef); font-weight: 650; }
      .galeria { display: block; image-rendering: pixelated; background: var(--bg, #0b0d11); }

  <body>
    <h1>galería de desarrollo</h1>

    <canvas class="galeria" id="galeria"></canvas>
    <script type="module" src="./src/galeria.js"></script>
